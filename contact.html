<!DOCTYPE html>
<html>
<body>
    <head>
        <meta charset="UTF-8">
        <title>Contact Me</title>
        <link href="main.css" rel="stylesheet" type="text/css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <h1>Contact Me</h1>
    <form action=mailto:email@email.com ?subject=Signup Form method="post"
        enctype="text/plain" name="form">
        <p>
            <label for="name">Name</label><br>
            <input type="text" name="name" size="32">
        </p>
        <p>
            <label for="email">Email</label><br>
            <input type="text" name="email" size="32">
        </p>
        <p>
            <label for="phone">Phone Number</label><br>
            <input type="number" name="phone" size="12">
        </p>
        <p>
            <label for="comments">Comments</label><br>
            <textarea name="comments" cols="60" rows="6"></textarea>
        </p>
        <p>
            <input type="submit" value="Submit form"/>
        </p>
    </form>
    <footer>
        <address>
            <p>
                Contact me at <a href="mailto:justin.chan2@ontariotechu.net">
                justin.chan2@ontariotechu.net</a>
            </p>
        </address>
    </footer>
</body>
</html>
